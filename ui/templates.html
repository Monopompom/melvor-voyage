<template id="voyage-page-template">
  <div class="content d-none voyage-ui" id="voyage-container">
    <div class="skill-info">
      <skill-header data-skill-id="voyage:Voyage"></skill-header>
    </div>
    <!-- Build .146 (the user): the compass and the travels live in the status row, on a second line that folds; the time stays. -->
    <div class="block block-rounded voyage-status-block">
      <!-- Build .202 (the user): Show map moved from the Ship block to the left end of the clock bar. -->
      <div class="voyage-status-top">
        <button type="button" class="btn btn-sm btn-outline-info voyage-status-map" data-voyage="show-map"><lang-string lang-id="MOD_VOY_PAGE_SHOW_MAP"></lang-string></button>
        <div class="voyage-status-row" data-voyage="status"></div>
        <button type="button" class="voyage-legend-toggle voyage-status-toggle" data-voyage="status-toggle" aria-expanded="true" aria-controls="voyage-status-more"><i class="fa fa-caret-down mr-1"></i><lang-string lang-id="MOD_VOY_PAGE_STATUS_MORE"></lang-string></button>
      </div>
      <div class="row voyage-status-more" id="voyage-status-more" data-voyage="status-more">
        <!-- Phase 5c: the season and the wind, a band across all three columns; first, right under the clock bar (the user,
             build .297: "better near (under) the clock"; it sat at the foot in .294-.296). -->
        <div class="voyage-season-row d-none" data-voyage="season"></div>
        <div class="col-12 col-md-6">
          <div class="d-flex align-items-center mb-2">
            <img class="skill-icon-xs mr-2" data-voyage="compass-icon" alt="" />
            <h5 class="font-w600 mb-0"><lang-string lang-id="MOD_VOY_PAGE_COMPASS_TITLE"></lang-string><button type="button" class="btn btn-sm voyage-help" data-voyage-help="compass"><i class="fa fa-question-circle"></i></button></h5>
          </div>
          <div data-voyage="compass"></div>
        </div>
        <!-- Build .160 (the user): a square between the two panels, a round portrait of how you travel on land.
             Build .162 (the user): a second square under it for the Crossroads Sign. -->
        <div class="voyage-land-col" data-voyage="land-col">
          <div class="voyage-land-spacer" aria-hidden="true"></div>
          <div class="voyage-land-wrap">
            <div class="voyage-land-tile" data-voyage="land"></div>
            <div class="voyage-land-tile voyage-sign-tile" data-voyage="sign"></div>
          </div>
        </div>
        <div class="col-12 col-md-6">
          <div class="d-flex align-items-center mb-2">
            <img class="skill-icon-xs mr-2" data-voyage="travels-icon" alt="" />
            <h5 class="font-w600 mb-0"><lang-string lang-id="MOD_VOY_PAGE_TRAVELS_TITLE"></lang-string><button type="button" class="btn btn-sm voyage-help" data-voyage-help="travels"><i class="fa fa-question-circle"></i></button></h5>
          </div>
          <div data-voyage="travels"></div>
        </div>
      </div>
    </div>
    <!-- Phase 5a: the voyage under way (or the last one's ending), above the movable blocks; drawn by src/voyage-clock.mjs. -->
    <div class="block block-rounded border-top border-voyage border-4x d-none voyage-block voyage-underway-block" data-voyage="underway-block">
      <div class="block-content p-3">
        <div data-voyage="underway"></div>
      </div>
    </div>
    <div class="row">
      <!-- Build .133 (the user's sketch): the plan and the hold on the left; stores and ship on the right. -->
      <!-- Build .203 (the user): the blocks drag between and within the columns by their title row, and fold; the
           order and the folds are kept per browser (src/page-layout.mjs). -->
      <div class="col-12 col-lg-6 voyage-col voyage-col-left" data-voyage="col-left">
        <div class="block block-rounded border-top border-voyage border-4x d-none voyage-block" data-voyage="plan-block">
          <div class="block-content p-3">
            <div class="voyage-block-head"><h5 class="font-w600 mb-0"><i class="fa fa-route voyage-title-fa" aria-hidden="true"></i><lang-string lang-id="MOD_VOY_PLAN_TITLE"></lang-string></h5></div>
            <div data-voyage="plan"></div>
          </div>
        </div>
        <div class="block block-rounded border-top border-voyage border-4x d-none voyage-block" data-voyage="hold-block">
          <div class="block-content p-3">
            <div class="voyage-block-head">
              <h5 class="font-w600 mb-0"><lang-string lang-id="MOD_VOY_HOLD_LABEL"></lang-string><button type="button" class="btn btn-sm voyage-help" data-voyage-help="hold"><i class="fa fa-question-circle"></i></button></h5>
              <span class="font-w600" data-voyage="hold-slots"></span>
            </div>
            <div data-voyage="hold"></div>
          </div>
        </div>
      </div>
      <div class="col-12 col-lg-6 voyage-col voyage-col-right" data-voyage="col-right">
        <div class="block block-rounded border-top border-voyage border-4x voyage-block" data-voyage="stores-block">
          <div class="block-content p-3">
            <div class="voyage-block-head"><h5 class="font-w600 mb-0"><lang-string lang-id="MOD_VOY_PAGE_STORES_TITLE"></lang-string><button type="button" class="btn btn-sm voyage-help" data-voyage-help="stores"><i class="fa fa-question-circle"></i></button></h5></div>
            <div data-voyage="stores"></div>
          </div>
        </div>
        <div class="block block-rounded border-top border-voyage border-4x voyage-block" data-voyage="ship-block">
          <div class="block-content p-3">
            <div class="voyage-block-head"><h5 class="font-w600 mb-0"><lang-string lang-id="MOD_VOY_PAGE_SHIP_TITLE"></lang-string><button type="button" class="btn btn-sm voyage-help" data-voyage-help="ship"><i class="fa fa-question-circle"></i></button></h5></div>
            <div data-voyage="ship"></div>
          </div>
        </div>
      </div>
    </div>
    <div class="voyage-layout-foot d-none" data-voyage="layout-foot"></div>
  </div>
</template>
